[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoom"
version = "0.1.0a20260814"
description = "balanced data splitting"
readme = "README.md"
requires-python = ">=3.11" # inherent to bblean. code itself is 3.10
authors= [{name = "lucina-may"}]
dependencies = [
    "polars>=1.35",
    "pulp>=3.3.0",
    "scikit-learn>=1.7.2",
]


[project.optional-dependencies]
chem = [
    "rdkit>=2025.3.6",
    "rich>=14.2.0",
    "bblean>=0.8.1",
]

tutorial = [
    "marimo",
]

plotting = [
    "matplotlib",
]


[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]

[tool.uv.workspace]
members = [
    ".",
    ".",
]

[tool.uv.sources]
nanoom = { workspace = true, editable = true }


[dependency-groups]
dev = [
  {include-group = "lint"},
  {include-group = "test"},
  "pytest-cov>=7.1.0",
]
lint = [
  "ruff"
]
test = [
    "nanoom[chem]",
    "pytest>=9.0.2",
    "gbmtsplits>=0.0.8",
]


[project.urls]
Homepage = "https://github.com/lucinamay/nanoom"

[tool.pytest.ini_options]
addopts = "--doctest-modules --cov=nanoom --cov-report=term-missing --cov-report=xml"
testpaths = ["tests", "nanoom"]
